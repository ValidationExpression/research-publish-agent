<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InkFlow · 登录态助手</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; padding: 12px 16px; margin: 0; color: #222; }
      h2 { font-size: 15px; margin: 0 0 12px; }
      label { display: block; font-size: 12px; margin: 8px 0 4px; color: #555; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
      button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      #status { margin-top: 12px; font-size: 13px; font-weight: 600; }
      #saved { color: #16a34a; font-size: 12px; min-height: 14px; }
      .hint { font-size: 11px; color: #999; margin-top: 10px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h2>InkFlow · 登录态助手</h2>
    <label>本地服务地址</label>
    <input id="serverUrl" value="ws://localhost:9527" />
    <label>Token（与本地服务 WECHATSYNC_TOKEN 一致）</label>
    <input id="token" type="password" placeholder="设置后本地服务需相同 Token" />
    <button id="save">保存并重连</button>
    <div id="status">状态：未知</div>
    <div id="saved"></div>
    <div class="hint">本插件仅通过 WebSocket 把你在浏览器已登录平台的 Cookie 提供给本地服务，不读取/上传任何文章内容，不执行发稿。</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
