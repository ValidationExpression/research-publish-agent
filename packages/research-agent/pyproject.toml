[project]
name = "research-publish-agent"
version = "0.1.0"
description = "Research sidecar for Research Publish Agent desktop app"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain-openai>=1.3.4",
    "langchain-anthropic>=1.5.3,<2.0.0",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.13.4",
    "tavily-python>=0.7.26",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_agent"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
